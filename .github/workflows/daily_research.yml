name: Daily Research

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 03:00 ARG
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data/raw data/trades data/optimization data/certifications reports

      - name: Run full pipeline
        run: python run_lab.py
        continue-on-error: true

      - name: Show report summary
        run: |
          echo "=== CERTIFICATION REPORT ==="
          cat reports/CERTIFICATION_REPORT.md 2>/dev/null || echo "No report generated"
          echo ""
          echo "=== FULL REPORT (head) ==="
          head -80 reports/full_report.txt 2>/dev/null || echo "No full report"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-results-${{ github.run_number }}
          path: |
            reports/
            data/optimization/
            data/trades/
          retention-days: 30
