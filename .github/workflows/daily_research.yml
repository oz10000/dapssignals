# .github/workflows/daily_research.yml
# Ejecuta el pipeline completo (run_lab.py) cada día a las 06:00 UTC
# Genera reportes y los publica como artifacts descargables.

name: Daily Research

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC = 03:00 ARG
  workflow_dispatch:          # Permite ejecución manual desde GitHub UI

jobs:
  research:
    name: Run Ophelia Research Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directories
        run: |
          mkdir -p data/raw data/trades data/optimization data/certifications reports

      - name: Run diagnostic (optional, non-blocking)
        run: python diagnose.py || echo "⚠️ Diagnostic falló pero continuamos"

      - name: Execute full pipeline
        run: python run_lab.py
        continue-on-error: true

      - name: Show report summary
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  ARCHIVOS GENERADOS"
          echo "════════════════════════════════════════════════════════════"
          ls -la reports/ 2>/dev/null || echo "No reports dir"
          ls -la data/trades/ 2>/dev/null || echo "No trades dir"
          ls -la data/optimization/ 2>/dev/null || echo "No optimization dir"
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  HEAD DEL REPORTE OPERATIVO"
          echo "════════════════════════════════════════════════════════════"
          head -60 reports/OPHELIA_OPERATIONAL_REPORT.md 2>/dev/null || echo "No operational report"

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ophelia-research-${{ github.run_number }}
          path: |
            reports/
            data/optimization/
            data/trades/
          retention-days: 30
          if-no-files-found: warn
