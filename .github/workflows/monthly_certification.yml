# .github/workflows/manual_run.yml
# Permite ejecutar el pipeline completo manualmente desde GitHub UI
# con opciones configurables.

name: Manual Pipeline Run

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Tarea a ejecutar'
        required: true
        default: 'full'
        type: choice
        options:
          - full           # Pipeline completo
          - backtest       # Solo backtest
          - diagnostic     # Solo diagnóstico
      symbols_limit:
        description: 'Limitar a N activos (0 = todos)'
        required: false
        default: '0'
        type: string

jobs:
  manual:
    name: Manual ${{ github.event.inputs.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data/raw data/trades data/optimization data/certifications reports

      - name: Run diagnostic
        if: github.event.inputs.task == 'diagnostic'
        run: python diagnose.py

      - name: Run backtest only
        if: github.event.inputs.task == 'backtest'
        run: |
          python -c "
          from data_engine import DataEngine
          from signal_engine import Signal
          from ophelia_lab.backtest_engine import BacktestEngine
          from config import SYMBOLS, DEFAULT_PARAMS
          import json
          from pathlib import Path
          
          limit = int('${{ github.event.inputs.symbols_limit }}') or len(SYMBOLS)
          de = DataEngine()
          data = {}
          for sym in SYMBOLS[:limit]:
              df = de.fetch_ohlcv(sym, limit=500)
              if df is not None and not df.empty:
                  data[sym] = df
          print(f'Descargados {len(data)} activos')
          
          def sig_fn(s, df):
              return Signal(s, df, DEFAULT_PARAMS).to_dict()
          
          bt = BacktestEngine()
          trades = bt.run(data, sig_fn)
          metrics = bt.compute_metrics()
          
          Path('data/optimization').mkdir(parents=True, exist_ok=True)
          Path('data/optimization/backtest_metrics.json').write_text(
              json.dumps(metrics, default=str, indent=2)
          )
          if not trades.empty:
              Path('data/trades').mkdir(parents=True, exist_ok=True)
              trades.to_parquet('data/trades/trades.parquet')
          print(json.dumps(metrics, default=str, indent=2))
          "

      - name: Run full pipeline
        if: github.event.inputs.task == 'full'
        run: python run_lab.py
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-run-${{ github.run_number }}
          path: |
            reports/
            data/
          retention-days: 30
          if-no-files-found: warn
