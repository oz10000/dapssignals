# .github/workflows/ophelia_pipeline.yml
# ============================================================
# OPHELIA PRECISION ENGINE — Pipeline Completo
# ============================================================
# Este único workflow:
#   1. Instala dependencias
#   2. Descarga datos reales
#   3. Entrena el OPHELIA Score
#   4. Calibra thresholds OPHELIA + STANDARD
#   5. Genera todos los reportes
#   6. Commitea los archivos al repo (para que Streamlit los lea)
#   7. Sube artifacts de respaldo
# ============================================================

name: OPHELIA Pipeline

on:
  schedule:
    # Corre todos los días a las 06:00 UTC = 03:00 ARG
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      assets_limit:
        description: 'Limitar activos (0 = todos)'
        required: false
        default: '0'
        type: string
      force_commit:
        description: 'Forzar commit de resultados'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# ============================================================
# PERMISOS (necesarios para commitear)
# ============================================================
permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'

jobs:
  ophelia:
    name: 🌟 OPHELIA Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. VERIFY FILES EXIST
      # ============================================================
      - name: 🔍 Verify required files
        run: |
          echo "=== Archivos del repo ==="
          ls -la
          echo ""
          echo "=== ophelia_engine/ ==="
          ls -la ophelia_engine/ || echo "❌ FALTA ophelia_engine/"
          echo ""
          MISSING=0
          for f in run_ophelia_v2.py ophelia_v2_config.py config.py data_engine.py signal_engine.py core_engine.py; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ FALTA: $f"; MISSING=$((MISSING+1)); fi
          done
          for f in ophelia_engine/__init__.py ophelia_engine/trade_collector.py ophelia_engine/ophelia_scorer.py ophelia_engine/daily_selector.py ophelia_engine/leverage_optimizer.py ophelia_engine/temporal_analyzer.py ophelia_engine/certifier.py ophelia_engine/report_generator.py; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ FALTA: $f"; MISSING=$((MISSING+1)); fi
          done
          if [ $MISSING -gt 0 ]; then echo ""; echo "❌ Faltan $MISSING archivos"; exit 1; fi

      # ============================================================
      # 5. CREATE DIRECTORIES
      # ============================================================
      - name: 📁 Create directories
        run: |
          mkdir -p data/raw
          mkdir -p data/ophelia_v2
          mkdir -p data/trades
          mkdir -p data/optimization
          mkdir -p reports
          echo "✅ Directorios creados"

      # ============================================================
      # 6. RUN OPHELIA PIPELINE
      # ============================================================
      - name: 🌟 Run OPHELIA pipeline
        env:
          OPHELIA_ASSETS_LIMIT: ${{ github.event.inputs.assets_limit || '0' }}
        run: |
          echo "=================================================="
          echo "  INICIANDO PIPELINE OPHELIA"
          echo "  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=================================================="
          python run_ophelia_v2.py 2>&1 || echo "⚠️ Pipeline terminó con código de error (revisar arriba)"
          echo "=================================================="
          echo "  PIPELINE FINALIZADO"
          echo "  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=================================================="
        continue-on-error: true

      # ============================================================
      # 7. VERIFY OUTPUTS
      # ============================================================
      - name: 📊 Verify outputs
        if: always()
        run: |
          echo "=== data/ophelia_v2/ ==="
          ls -la data/ophelia_v2/ || echo "(vacío)"
          echo ""
          echo "=== reports/ ==="
          ls -la reports/ || echo "(vacío)"
          echo ""
          echo "=== Tamaños ==="
          du -sh data/* reports/* 2>/dev/null || true

      # ============================================================
      # 8. SHOW REPORT
      # ============================================================
      - name: 📄 Show OPHELIA report
        if: always()
        run: |
          if [ -f reports/OPHELIA_DAILY_CERTIFICATION_REPORT.md ]; then
            echo "=== REPORTE OPHELIA ==="
            head -80 reports/OPHELIA_DAILY_CERTIFICATION_REPORT.md
          else
            echo "⚠️ No hay reporte OPHELIA"
          fi

      # ============================================================
      # 9. COMMIT RESULTS TO REPO
      # ============================================================
      - name: 📤 Commit results to repo
        if: always()
        run: |
          git config user.name "OPHELIA Bot"
          git config user.email "ophelia-bot@users.noreply.github.com"

          # Añadir archivos generados
          git add -f data/ophelia_v2/ 2>/dev/null || true
          git add -f reports/ 2>/dev/null || true

          # Ver si hay cambios
          if git diff --staged --quiet; then
            echo "ℹ️ No hay cambios para commitear"
          else
            git commit -m "🌟 OPHELIA Pipeline run #${{ github.run_number }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Resultados commiteados al repo"
          fi

      # ============================================================
      # 10. UPLOAD ARTIFACTS (respaldo)
      # ============================================================
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ophelia-results-${{ github.run_number }}
          path: |
            data/ophelia_v2/
            reports/
          retention-days: 90
          if-no-files-found: warn

      # ============================================================
      # 11. SUMMARY
      # ============================================================
      - name: 📋 Summary
        if: always()
        run: |
          echo "## 🌟 OPHELIA Pipeline Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in data/ophelia_v2/model.pkl data/ophelia_v2/metadata.json data/ophelia_v2/trades.parquet data/ophelia_v2/daily_selection.parquet reports/OPHELIA_DAILY_CERTIFICATION_REPORT.md; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f" 2>/dev/null || echo "?")
              echo "| \`$f\` | ✅ ($SIZE bytes) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| \`$f\` | ❌ |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Streamlit leerá los archivos automáticamente" >> $GITHUB_STEP_SUMMARY
