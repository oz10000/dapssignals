# .github/workflows/run_ophelia.yml — VERSIÓN CORREGIDA
name: OPHELIA Precision Engine

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      assets_limit:
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  # Crítico para ver errores en tiempo real
  PYTHONFAULTHANDLER: '1'

jobs:
  ophelia-pipeline:
    name: 🌟 OPHELIA Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📁 Create directories
        run: |
          mkdir -p data/raw data/trades data/ophelia data/optimization reports
          ls -la data/

      - name: 🔍 Verify files exist
        run: |
          echo "=== LISTANDO REPO ==="
          ls -la
          echo ""
          echo "=== LISTANDO ophelia_engine ==="
          ls -la ophelia_engine/ || echo "❌ ophelia_engine/ NO EXISTE"
          echo ""
          echo "=== VERIFICANDO ARCHIVOS CLAVE ==="
          MISSING=0
          for f in run_ophelia.py ophelia_config.py config.py data_engine.py signal_engine.py core_engine.py; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ FALTA: $f"
              MISSING=$((MISSING+1))
            fi
          done
          for f in ophelia_engine/__init__.py ophelia_engine/pattern_extractor.py ophelia_engine/ophelia_detector.py ophelia_engine/temporal_predictor.py ophelia_engine/leverage_calculator.py ophelia_engine/certification.py ophelia_engine/report_generator.py ophelia_engine/trade_simulator.py; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ FALTA: $f"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "❌ Faltan $MISSING archivos. ABORTANDO."
            exit 1
          fi

      - name: 🧪 Test imports SIN conectar a exchanges
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          print('Testing config...')
          from config import SYMBOLS, DEFAULT_PARAMS
          print(f'  ✅ config: {len(SYMBOLS)} symbols')
          print('Testing core_engine...')
          from core_engine import compute_adx, compute_atr
          print('  ✅ core_engine OK')
          print('Testing ophelia_config...')
          from ophelia_config import OPHELIA_PATTERNS_FILE
          print(f'  ✅ ophelia_config: {OPHELIA_PATTERNS_FILE}')
          print('Testing ophelia_engine (sin DataEngine)...')
          from ophelia_engine import PatternExtractor, OpheliaDetector, TemporalPredictor, LeverageCalculator
          from ophelia_engine.trade_simulator import simulate_trade_from_signal
          print('  ✅ ophelia_engine OK')
          print('')
          print('✅ TODOS LOS IMPORTS OK')
          "
        timeout-minutes: 2

      - name: 🌟 Run OPHELIA pipeline (SIN continue-on-error)
        run: |
          echo "=================================================="
          echo "  INICIANDO PIPELINE OPHELIA"
          echo "  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=================================================="
          python run_ophelia.py 2>&1
          echo "=================================================="
          echo "  FINALIZADO"
          echo "  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=================================================="
        # ⚠️ SIN continue-on-error. Si falla, el workflow falla.
        timeout-minutes: 200

      - name: 📊 Verificar outputs
        if: always()
        run: |
          echo "=== data/ ==="
          find data/ -type f 2>/dev/null | head -50 || echo "(vacío)"
          echo ""
          echo "=== reports/ ==="
          find reports/ -type f 2>/dev/null || echo "(vacío)"
          echo ""
          echo "=== Tamaños ==="
          du -sh data/* reports/* 2>/dev/null || true

      - name: 📄 Mostrar reporte
        if: always()
        run: |
          if [ -f reports/OPHELIA_CERTIFICATION_REPORT.md ]; then
            cat reports/OPHELIA_CERTIFICATION_REPORT.md
          elif [ -f reports/OPHELIA_NOT_AVAILABLE.md ]; then
            cat reports/OPHELIA_NOT_AVAILABLE.md
          else
            echo "⚠️ Ningún reporte encontrado"
          fi

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ophelia-full-${{ github.run_number }}
          path: |
            reports/
            data/ophelia/
            data/trades/
          retention-days: 90
          if-no-files-found: warn

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 🌟 OPHELIA Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in data/ophelia/learned_patterns.json data/ophelia/all_trades.parquet reports/OPHELIA_CERTIFICATION_REPORT.md reports/OPHELIA_NOT_AVAILABLE.md; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f" 2>/dev/null || echo "?")
              echo "| \`$f\` | ✅ ($SIZE bytes) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| \`$f\` | ❌ |" >> $GITHUB_STEP_SUMMARY
            fi
          done
